services:
  claude-code-configuration-development:
    build:
      args:
        # - csklint · PyPI
        #   https://pypi.org/project/csklint/
        VERSION_CSKLINT: 0.3.0
      context: .
    # Claude Code's built-in Bash sandbox uses bubblewrap, which fails inside an
    # unprivileged container with "No permissions to create a new namespace" even
    # when the host kernel allows unprivileged user namespaces. CAP_SYS_ADMIN and
    # a permissive seccomp policy are the combination most commonly reported to
    # help bubblewrap create the namespaces it needs, though this is not always
    # sufficient -- see containers/bubblewrap#505 for cases where even a long list
    # of added capabilities still failed short of --privileged:
    # https://github.com/containers/bubblewrap/issues/505
    cap_add:
      - SYS_ADMIN
    image: futureys/claude-code-configuration-development:local
    security_opt:
      - seccomp:unconfined
    secrets:
      # Mounted at /opt/claude-agent-secrets/, not the default /run/secrets/,
      # so git-agent-credential-helper.sh (see Dockerfile) can read it from
      # inside Claude Code's own Bash sandbox, which keeps /run/secrets
      # denied but allow-lists /opt/claude-agent-secrets/*.
      - source: git_auth_secret
        target: /opt/claude-agent-secrets/git_auth_token
      - source: slack_webhook_url
    volumes:
      - .:/workspace:cached
      - /workspace/.venv
      - ~/.claude:/root/.claude
      - ~/.claude.json:/root/.claude.json
      # - Using uv in Docker | uv
      #   https://docs.astral.sh/uv/guides/integration/docker/#caching
      - uv-cache:/root/.cache/uv
volumes:
  uv-cache:
secrets:
  git_auth_secret:
    environment: GIT_AUTH_TOKEN
  slack_webhook_url:
    environment: SLACK_WEBHOOK_URL
