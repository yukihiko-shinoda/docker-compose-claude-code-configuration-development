services:
  claude-code-configuration-development:
    build:
      args:
        DOCKER_IMAGE_TAG_NODE: ${DOCKER_IMAGE_TAG_NODE:?err}
        VERSION_CLAUDE_CODE: ${VERSION_CLAUDE_CODE:?err}
        VERSION_UV: ${VERSION_UV:?err}
        VERSION_CSKLINT: ${VERSION_CSKLINT:?err}
      context: .
    image: futureys/python-development:local
    volumes:
      - .:/workspace:cached
      - /workspace/.venv
      - ~/.claude:/root/.claude
      - ~/.claude.json:/root/.claude.json
      # - Using uv in Docker | uv
      #   https://docs.astral.sh/uv/guides/integration/docker/#caching
      - uv-cache:/root/.cache/uv
volumes:
  uv-cache:
